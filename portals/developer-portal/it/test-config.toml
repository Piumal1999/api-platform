# Integration Test Configuration
#
# Shared by docker-compose.test.yaml and docker-compose.test.postgres.yaml — mounted
# at /app/configs/config.toml in both. Settings that are identical across both DB
# variants live here; settings that differ (database connection, network hostnames)
# stay as APIP_DP_* env vars in each compose file's environment: block.

[tls]
# Use plain HTTP inside the test network so Cypress doesn't need to trust a cert.
enabled = false

[logging]
console_only = true

# Database connection differs per DB variant — each compose file's environment:
# block sets the APIP_DP_DATABASE_* vars (postgres: type/host/port/name/username/
# password; sqlite: type/file). This file mounts over configs/config.toml, so the
# env references that config.toml would normally provide must be repeated here.
[database]
type     = '{{ env "APIP_DP_DATABASE_TYPE" "sqlite" }}'
file     = '{{ env "APIP_DP_DATABASE_FILE" "/tmp/devportal-it.db" }}'
host     = '{{ env "APIP_DP_DATABASE_HOST" "localhost" }}'
port     = '{{ env "APIP_DP_DATABASE_PORT" "5432" }}'
name     = '{{ env "APIP_DP_DATABASE_NAME" "devportal" }}'
username = '{{ env "APIP_DP_DATABASE_USERNAME" "devportal" }}'
password = '{{ env "APIP_DP_DATABASE_PASSWORD" "devportal" }}'

[security]
# Required — devportal fails closed at startup without these.
encryption_key = '{{ env "APIP_DP_SECURITY_ENCRYPTIONKEY" }}'
session_secret = '{{ env "APIP_DP_SECURITY_SESSIONSECRET" }}'

[security.service_api_key]
enabled = true
value = "devportal-it-test-key"

[organization]
default_name = "default"
auto_create_subscription_plans = true

[platform_api]
# File-based (local) auth against the Platform API sidecar. Host is identical in
# both DB variants; insecure accepts its self-signed cert inside the test network.
base_url = "https://platform-api:9243"
insecure = true
